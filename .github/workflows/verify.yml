name: Verify shared UI source

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: shared-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"

      - name: Verify package and canonical assets
        run: |
          set -euo pipefail
          sha256sum --check CHECKSUMS.sha256
          npm test -- --test-reporter=spec

      - name: Bind an exact annotated tag to refreshed main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE" = "v$(node -p 'require("./package.json").version')"
          git_value() { bash .github/scripts/git_transport.sh local-read "$1" "$2"; }
          test "$(git_value cat-file-type "$GITHUB_REF")" = tag
          tag_object="$(git_value rev-parse "$GITHUB_REF")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
            "refs/tags/$RELEASE:refs/remotes/origin/release-tag" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git_value cat-file-type refs/remotes/origin/release-tag)" = tag
          test "$(git_value rev-parse refs/remotes/origin/release-tag)" = "$tag_object"
          release_commit="$(git_value rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA"
          test "$(git_value rev-parse HEAD)" = "$RELEASE_SHA"
          test "$release_commit" = "$(git_value rev-parse refs/remotes/origin/main)"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.2"

      - name: Package and publish the exact immutable release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE" = "v$version"

          git_value() { bash .github/scripts/git_transport.sh local-read "$1" "$2"; }
          bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
            "refs/tags/$RELEASE:refs/remotes/origin/release-tag" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git_value cat-file-type refs/remotes/origin/release-tag)" = tag
          tag_object="$(git_value rev-parse refs/remotes/origin/release-tag)"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          release_commit="$(git_value rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA"
          test "$release_commit" = "$(git_value rev-parse HEAD)"
          test "$release_commit" = "$(git_value rev-parse refs/remotes/origin/main)"
          release_body="Exact shared UI source and distributable for commit $RELEASE_SHA (annotated tag $tag_object)."

          bounded_command() {
            local max_stdout="$1" max_stderr="$2" max_file="$3" output="$4" stderr="$5" timeout_seconds="$6" status
            shift 6
            rm -f -- "$output" "$stderr"
            set +e
            bash .github/scripts/bounded-command.sh "$max_stdout" "$max_stderr" \
              "$output" "$stderr" "$timeout_seconds" "$@"
            status=$?
            set -e
            test "$(wc -c <"$output")" -le "$max_stdout"
            test "$(wc -c <"$stderr")" -le "$max_stderr"
            test "$(wc -c <"$output")" -le "$max_file"
            if [[ "$status" -eq 0 && -s "$stderr" ]]; then
              cat -- "$stderr" >&2
              return 1
            fi
            return "$status"
          }

          http_status() {
            local count
            count="$(grep -Ec '^HTTP/[0-9.]+[[:space:]][0-9]{3}([[:space:]]|$)' "$1")"
            test "$count" -eq 1
            sed -n '1s/^HTTP\/[0-9.]*[[:space:]]\([0-9][0-9][0-9]\).*$/\1/p' "$1"
          }

          http_body() {
            awk 'BEGIN { body = 0 } { line = $0; sub(/\r$/, "", line); if (!body) { if (line == "") body = 1; next } print }' "$1"
          }

          pack_json="$RUNNER_TEMP/npm-pack.json"
          pack_error="$RUNNER_TEMP/npm-pack.error"
          bounded_command $((1024 * 1024)) $((64 * 1024)) $((64 * 1024 * 1024)) \
            "$pack_json" "$pack_error" 120 npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json
          package_name="$(node -e 'const d=require(process.argv[1]); if (!Array.isArray(d) || d.length !== 1) process.exit(1); process.stdout.write(d[0].filename)' "$pack_json")"
          expected_package="telecrypt-io-ui-$version.tgz"
          test "$package_name" = "$expected_package"
          node -e '
            const d=require(process.argv[1]);
            const files=d[0].files.map(({path})=>path).sort();
            const expected=["LICENSE","README.md","assets/logo-mark.png","package.json","src/product.css"];
            if (JSON.stringify(files)!==JSON.stringify(expected)) process.exit(1);
          ' "$pack_json"
          package_path="$RUNNER_TEMP/$package_name"
          test -f "$package_path"
          package_size="$(wc -c <"$package_path")"
          test "$package_size" -gt 0 -a "$package_size" -le $((64 * 1024 * 1024))
          package_digest="sha256:$(sha256sum "$package_path" | awk '{print $1}')"
          printf 'package_name=%s\npackage_size=%s\npackage_digest=%s\n' \
            "$package_name" "$package_size" "$package_digest" >>"$GITHUB_OUTPUT"

          # Re-fetch the source identity after packaging. A tag run is publishable only when
          # the annotated tag still names this commit and the remote main branch is still this
          # exact commit; ancestry is insufficient for a release boundary.
          bash .github/scripts/git_transport.sh fetch "$GITHUB_REPOSITORY" \
            "refs/tags/$RELEASE:refs/remotes/origin/release-tag" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git_value cat-file-type refs/remotes/origin/release-tag)" = tag
          test "$(git_value rev-parse refs/remotes/origin/release-tag)" = "$tag_object"
          test "$(git_value rev-parse refs/remotes/origin/release-tag^{commit})" = "$RELEASE_SHA"
          test "$(git_value rev-parse refs/remotes/origin/main)" = "$RELEASE_SHA"

          release_json="$RUNNER_TEMP/release.json"
          release_error="$RUNNER_TEMP/release.error"
          release_headers="$RUNNER_TEMP/release.headers"
          get_release() {
            local command_status code
            set +e
            bounded_command $((1024 * 1024)) $((64 * 1024)) $((1024 * 1024)) \
              "$release_headers" "$release_error" 30 gh api --include --hostname github.com \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE"
            command_status=$?
            set -e
            code="$(http_status "$release_headers")"
            case "$code" in
              200)
                test "$command_status" -eq 0
                test ! -s "$release_error"
                http_body "$release_headers" >"$release_json"
                test "$(wc -c <"$release_json")" -le $((1024 * 1024))
                return 0
                ;;
              404)
                test "$command_status" -ne 0
                return 4
                ;;
              *)
                cat -- "$release_error" >&2
                return 1
                ;;
            esac
          }
          check_draft() {
            jq -e --arg tag "$RELEASE" --arg body "$release_body" --arg tag_object "$tag_object" --arg asset "$package_name" '
              type == "object" and (.id|type == "number") and .tag_name == $tag and
              .name == $tag and .body == $body and (.body | contains($tag_object)) and .draft == true and .prerelease == false and
              (.assets|type == "array" and length <= 1) and
              ((.assets|length) == 0 or
                ((.assets|length) == 1 and .assets[0].name == $asset and
                 .assets[0].state == "uploaded" and
                 (.assets[0].id|type == "number") and (.assets[0].size|type == "number")))
            ' "$release_json" >/dev/null
          }
          check_published() {
            jq -e --arg tag "$RELEASE" --arg body "$release_body" --arg tag_object "$tag_object" --arg asset "$package_name" \
              --arg digest "$package_digest" --argjson size "$package_size" '
                type == "object" and (.id|type == "number") and .tag_name == $tag and
                .name == $tag and .body == $body and (.body | contains($tag_object)) and .draft == false and
                .prerelease == false and .immutable == true and
                (.assets|type == "array" and length == 1) and
                .assets[0].name == $asset and .assets[0].state == "uploaded" and
                (.assets[0].id|type == "number") and .assets[0].size == $size and
                .assets[0].digest == $digest
              ' "$release_json" >/dev/null
          }
          release_state=''
          if get_release; then
            release_state="$(jq -er 'if .draft == true then "draft" elif .draft == false then "published" else empty end' "$release_json")"
            case "$release_state" in
              draft) check_draft ;;
              published)
                test "$GITHUB_RUN_ATTEMPT" -gt 1
                check_published
                ;;
              *) exit 1 ;;
            esac
          else
            status=$?
            test "$status" = 4
            set +e
            bounded_command $((64 * 1024)) $((64 * 1024)) $((64 * 1024)) \
              "$RUNNER_TEMP/release-create.log" "$RUNNER_TEMP/release-create.error" 60 \
              gh release create "$RELEASE" --repo "github.com/$GITHUB_REPOSITORY" --draft \
              --verify-tag --target "$RELEASE_SHA" --title "$RELEASE" --notes "$release_body"
            set -e
            # A timed-out create may have succeeded. Continue only after the exact draft can be
            # re-fetched; any published or ambiguous record remains a hard failure.
            get_release || exit 1
            test ! -s "$RUNNER_TEMP/release-create.error"
            check_draft
            release_state='draft'
          fi
          if [[ "$release_state" == draft ]]; then
            asset_count="$(jq -er '.assets|length' "$release_json")"
            if [[ "$asset_count" -eq 0 ]]; then
              set +e
              bounded_command $((64 * 1024)) $((64 * 1024)) $((64 * 1024)) \
                "$RUNNER_TEMP/release-upload.log" "$RUNNER_TEMP/release-upload.error" 120 \
                gh release upload "$RELEASE" "$package_path" --repo "github.com/$GITHUB_REPOSITORY"
              upload_status=$?
              set -e
              test ! -s "$RUNNER_TEMP/release-upload.error"
            fi
            get_release
            check_draft
          fi
          asset_id="$(jq -er --arg asset "$package_name" '.assets | select(length == 1) | .[0] | select(.name == $asset) | .id' "$release_json")"
          downloaded="$RUNNER_TEMP/$package_name"
          bounded_command "$((64 * 1024 * 1024))" $((64 * 1024)) $((64 * 1024 * 1024)) \
            "$downloaded" "$RUNNER_TEMP/release-download.error" 120 \
            gh api --hostname github.com --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          test "$(wc -c <"$downloaded")" -le "$package_size"
          cmp "$package_path" "$downloaded"
          test "$(wc -c <"$downloaded")" = "$package_size"
          test "$(sha256sum "$downloaded" | awk '{print "sha256:"$1}')" = "$package_digest"
          if [[ "$release_state" == draft ]]; then
            set +e
            bounded_command $((64 * 1024)) $((64 * 1024)) $((64 * 1024)) \
              "$RUNNER_TEMP/release-edit.log" "$RUNNER_TEMP/release-edit.error" 60 \
              gh release edit "$RELEASE" --repo "github.com/$GITHUB_REPOSITORY" \
              --draft=false --verify-tag --title "$RELEASE" --notes "$release_body"
            edit_status=$?
            set -e
            test ! -s "$RUNNER_TEMP/release-edit.error"
            get_release
          fi
          check_published

      - name: Preserve the hosted exact package for release recovery
        if: ${{ always() && steps.package.outputs.package_name != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shared-ui-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ steps.package.outputs.package_name }}
          if-no-files-found: error
          retention-days: 7
