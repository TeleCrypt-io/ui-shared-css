name: Verify shared UI source

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify canonical assets
        run: sha256sum --check CHECKSUMS.sha256

      - name: Require package version to equal release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$RELEASE"
