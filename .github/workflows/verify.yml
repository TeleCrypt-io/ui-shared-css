name: Verify shared UI source

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_KEY_1: advice.detachedHead
      GIT_CONFIG_VALUE_1: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.23.2"

      - name: Verify canonical assets
        run: sha256sum --check CHECKSUMS.sha256

      - name: Require an exact annotated release tag on refreshed main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match v<major>.<minor>.<patch> without leading zeroes: $RELEASE" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$RELEASE"
          timeout 30s git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git cat-file -t "refs/tags/$RELEASE")" = tag
          release_commit="$(git rev-parse "refs/tags/$RELEASE^{commit}")"
          test "$release_commit" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
